name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy All Edge Functions to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zcadkovymrnjpjaxvnao
        run: |
          supabase functions deploy create-checkout-session --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy shopify-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy stripe-connect-oauth --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy cancel-subscription --project-ref "$PROJECT_REF"
          supabase functions deploy moderate-comment --project-ref "$PROJECT_REF" --no-verify-jwt